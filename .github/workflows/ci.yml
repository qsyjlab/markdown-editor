name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Unit tests (parser)
        run: pnpm --filter @md-doc-editor/parser test

      - name: Build parser
        run: pnpm --filter @md-doc-editor/parser build

      - name: Build theme
        run: pnpm --filter @md-doc-editor/theme build

      - name: Build editor
        run: pnpm --filter @md-doc-editor/editor build
